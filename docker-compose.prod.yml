services:
  backend:
    build:
      context: ./WebApplication_App_Concurso
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "${NEON_CONNECTION_STRING}"
      Security__CreateConcursoApiKey: "${CONCURSO_API_KEY}"
      ScrapingSettings__BaseUrl: "https://www.concursosnobrasil.com.br/concursos"
      ScrapingSettings__PciUrl: "https://www.pciconcursos.com.br/concursos"
      ScrapingSettings__UserAgent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36"
      JobsSettings__UrlCreateConcurso: "http://localhost:8080/api/Concurso"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s